<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BST Explorer — Learn Binary Search Trees by Playing</title>
    <meta name="description" content="Interactive educational platform to learn Binary Search Trees through video walkthroughs, uploadable media, step-by-step guided practice, interactive lab, quizzes, and gamified challenges." />
    <meta property="og:title" content="BST Explorer — Learn • Think • Build" />
    <meta property="og:description" content="Learn Binary Search Trees through video walkthroughs, uploadable media, step-by-step guided practice, interactive lab, and gamified challenges." />
    <meta property="og:type" content="website" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('bst_theme_preference');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
